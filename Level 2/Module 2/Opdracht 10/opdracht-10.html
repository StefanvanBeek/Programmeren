<!DOCTYPE html>

<body>

    <script>
       let invoer = prompt("Voer iets in:");
       let type = typeof(invoer);
       alert("Je hebt een " + type + " ingevoerd!");
    </script>
    //Het type is bijna altijd hetzelfde want prompt() slaat alles op als tekst. Bij annuleren geeft prompt() een null. Hierdoor krijg je dan object.
